<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="50%" stop-color="#1a0a30"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(192,132,252,0.12)"/>
      <stop offset="100%" stop-color="rgba(168,85,247,0.04)"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(192,132,252,0.4)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="150" r="300" fill="url(#glow2)" opacity="0.2"/>
  <circle cx="150" cy="450" r="200" fill="rgba(192,132,252,0.08)" opacity="0.3"/>
  
  <!-- Grid lines -->
  <g opacity="0.02">
    <line x1="0" y1="100" x2="800" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="800" y2="500" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Hero section -->
  <rect x="60" y="50" width="680" height="240" rx="20" fill="url(#card2)" stroke="rgba(192,132,252,0.15)" stroke-width="1"/>
  
  <!-- Hero decorative image -->
  <rect x="480" y="70" width="240" height="200" rx="16" fill="rgba(255,255,255,0.04)"/>
  <ellipse cx="600" cy="170" rx="80" ry="60" fill="rgba(192,132,252,0.15)"/>
  <ellipse cx="600" cy="165" rx="40" ry="30" fill="url(#accent2)" opacity="0.3"/>
  <path d="M580 165 l20 -10 l20 10 l-20 10 z" fill="url(#gold)" opacity="0.5"/>
  
  <!-- Hero text -->
  <rect x="80" y="80" width="120" height="8" rx="4" fill="url(#accent2)" opacity="0.6"/>
  <rect x="80" y="100" width="280" height="14" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="80" y="122" width="220" height="14" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="80" y="152" width="340" height="10" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="80" y="170" width="300" height="10" rx="4" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Button -->
  <rect x="80" y="200" width="140" height="36" rx="18" fill="url(#accent2)"/>
  <rect x="240" y="200" width="140" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Categories -->
  <rect x="60" y="310" width="680" height="50" rx="12" fill="rgba(255,255,255,0.03)"/>
  <rect x="80" y="322" width="80" height="26" rx="13" fill="rgba(192,132,252,0.2)"/>
  <rect x="172" y="322" width="80" height="26" rx="13" fill="rgba(255,255,255,0.06)"/>
  <rect x="264" y="322" width="80" height="26" rx="13" fill="rgba(255,255,255,0.06)"/>
  <rect x="356" y="322" width="80" height="26" rx="13" fill="rgba(255,255,255,0.06)"/>
  
  <!-- Product grid -->
  <rect x="60" y="380" width="210" height="170" rx="14" fill="url(#card2)" stroke="rgba(192,132,252,0.1)" stroke-width="1"/>
  <rect x="76" y="396" width="178" height="90" rx="8" fill="rgba(255,255,255,0.06)"/>
  <rect x="76" y="494" width="120" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="76" y="510" width="80" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="76" y="526" width="60" height="10" rx="4" fill="url(#gold)"/>
  
  <rect x="295" y="380" width="210" height="170" rx="14" fill="url(#card2)" stroke="rgba(192,132,252,0.1)" stroke-width="1"/>
  <rect x="311" y="396" width="178" height="90" rx="8" fill="rgba(255,255,255,0.06)"/>
  <rect x="311" y="494" width="120" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="311" y="510" width="80" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="311" y="526" width="60" height="10" rx="4" fill="url(#gold)"/>
  
  <rect x="530" y="380" width="210" height="170" rx="14" fill="url(#card2)" stroke="rgba(192,132,252,0.1)" stroke-width="1"/>
  <rect x="546" y="396" width="178" height="90" rx="8" fill="rgba(255,255,255,0.06)"/>
  <rect x="546" y="494" width="120" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="546" y="510" width="80" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="546" y="526" width="60" height="10" rx="4" fill="url(#gold)"/>
  
  <text x="400" y="575" text-anchor="middle" fill="rgba(255,255,255,0.04)" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="2">AURA COLLECTION</text>
</svg>
