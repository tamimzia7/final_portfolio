  <circle cx="270" cy="170" r="10" fill="#3BC9FF"/>
  <circle cx="270" cy="170" r="4" fill="white"/>
  
  <circle cx="370" cy="120" r="16" fill="rgba(59,201,255,0.1)" stroke="#3BC9FF" stroke-width="1" opacity="0.6"/>
