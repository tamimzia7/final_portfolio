  <rect x="80" y="430" width="640" height="40" rx="10" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="450" r="14" fill="rgba(59,201,255,0.1)"/>
  <circle cx="100" cy="450" r="6" fill="#3BC9FF" opacity="0.6"/>
  <rect x="124" y="444" width="140" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="124" y="460" width="90" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  
  <rect x="80" y="480" width="640" height="40" rx="10" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="500" r="14" fill="rgba(59,201,255,0.08)"/>
