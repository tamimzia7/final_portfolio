  <rect x="124" y="494" width="130" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="124" y="510" width="110" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  
  <text x="400" y="575" text-anchor="middle" fill="rgba(255,255,255,0.04)" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="2">VISICORE</text>
