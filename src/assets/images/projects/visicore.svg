  <rect x="60" y="360" width="680" height="200" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="80" y="380" width="640" height="40" rx="10" fill="rgba(59,201,255,0.06)"/>
  <circle cx="100" cy="400" r="14" fill="rgba(59,201,255,0.15)"/>
