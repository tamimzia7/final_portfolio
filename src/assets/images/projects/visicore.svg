  <text x="550" y="240" text-anchor="middle" fill="#3BC9FF" font-family="Inter, sans-serif" font-size="28" font-weight="700">24</text>
  <rect x="510" y="256" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="510" y="270" width="60" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="510" y="290" width="80" height="20" rx="10" fill="rgba(59,201,255,0.2)"/>
  
  <rect x="620" y="200" width="120" height="130" rx="14" fill="url(#card3)" stroke="rgba(59,201,255,0.08)" stroke-width="1"/>
  <text x="680" y="240" text-anchor="middle" fill="#3BC9FF" font-family="Inter, sans-serif" font-size="28" font-weight="700">12</text>
  <rect x="640" y="256" width="80" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="640" y="270" width="60" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="640" y="290" width="80" height="20" rx="10" fill="rgba(59,201,255,0.2)"/>
  
